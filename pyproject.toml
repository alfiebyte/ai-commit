[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-commit"
version = "0.1.0"
description = "Uses AI to write your git commits"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["ollama"]

[project.scripts]
ai-commit = "ai_commit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
